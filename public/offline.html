<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Can't reach the CRM</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #111318;
        --muted: #5c6370;
        --accent: #f97316;
        --on-accent: #111318;
        --border: #e2e4ea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the CRM</h1>
      <p>
        The app is installed, but this device cannot reach the server. Records stay
        online. Check the connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
